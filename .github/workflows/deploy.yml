name: Deploy MkDocs to GitHub Pages
on:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pages-deploy
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install MkDocs and plugins
        run: pip install -r requirements.txt

      # Same script serve.bat runs locally, so CI and local builds agree.
      - name: Fill in page titles and placeholders
        run: python fix_titles.py

      # --strict fails the deploy on broken links or a missing template asset
      - name: Build and deploy
        run: mkdocs gh-deploy --force --strict
